<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönlendiriliyor... | Mobelmor</title>
    <script>
        // Universal Smart Redirect for Clean URLs on Static Hosts
        (function() {
            var path = window.location.pathname.toLowerCase();
            var search = window.location.search;
            var hash = window.location.hash;
            
            // Check if it's a product route: /urun/... or contains product-detail
            if (path.startsWith('/urun/') || path.includes('urun-detay') || path.includes('product-detail')) {
                window.location.replace('/urun-detay.html' + (search ? search : '') + hash);
                return;
            }
            
            // Check if it's an informational / legal route
            var legalMap = {
                'garanti-iade': '/garanti-iade.html',
                'kumas-kartelasi': '/kumas-kartelasi.html',
                'gizlilik-guvenlik': '/gizlilik-guvenlik.html',
                'mesafeli-satis-sozlesmesi': '/mesafeli-satis-sozlesmesi.html',
                'sss': '/sss.html'
            };
            for (var key in legalMap) {
                if (path.includes(key)) {
                    window.location.replace(legalMap[key] + (search ? search : '') + hash);
                    return;
                }
            }

            // Check if it's a category or campaign route
            var catSlugs = [
                'oturma-odasi', 'yemek-odasi', 'yatak-odasi', 'bahce', 
                'tv-uniteleri', 'dekorasyon', 'aydinlatma', 'hali', 
                'tum-koleksiyon', 'tum-urunler', 'sepette-indirimler', 
                'cok-satanlar', '2026-yaz-trendleri'
            ];
            var isCat = catSlugs.some(function(slug) { return path.includes(slug); });
            if (isCat || path.includes('kategori') || path.includes('category')) {
                window.location.replace('/kategori.html' + (search ? search : '') + hash);
                return;
            }
            
            // Fallback to home
            window.location.replace('/' + (search ? search : '') + hash);
        })();
    </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #faf9fc; color: #18181b;">
    <div style="text-align: center; padding: 20px;">
        <div style="width: 48px; height: 48px; border: 3px solid #e4e4e7; border-top-color: #18181b; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px auto;"></div>
        <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 6px;">Yükleniyor...</h2>
        <p style="color: #71717a; font-size: 0.88rem; margin: 0;">Sayfa yönlendiriliyor, lütfen bekleyin.</p>
    </div>
    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>
