<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Royal Purple Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0b5c" />
      <stop offset="45%" stop-color="#6b1480" />
      <stop offset="100%" stop-color="#8c1cae" />
    </linearGradient>

    <!-- Warm Amber Gold Crown Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- White-to-Lavender Crisp Monogram Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>

    <!-- Glassmorphic Rim Light -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f0228" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Subtle Glass Border Highlight -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="url(#ringGrad)" stroke-width="7" />

  <!-- Emblem Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Architectural Furniture Arch (Gold Accent Roof) -->
    <path d="M 160 148 C 210 100, 302 100, 352 148 C 308 118, 204 118, 160 148 Z" fill="url(#goldGrad)" />
    <circle cx="256" cy="116" r="14" fill="url(#goldGrad)" />

    <!-- Sculpted Modern 'M' Monogram -->
    <path d="M 132 376 
             V 192 
             C 132 172, 148 156, 168 156 
             C 183 156, 196 166, 204 179 
             L 256 262 
             L 308 179 
             C 316 166, 329 156, 344 156 
             C 364 156, 380 172, 380 192 
             V 376 
             C 380 392, 367 404, 351 404 
             C 335 404, 322 392, 322 376 
             V 244 
             L 274 319 
             C 266 331, 246 331, 238 319 
             L 190 244 
             V 376 
             C 190 392, 177 404, 161 404 
             C 145 404, 132 392, 132 376 Z" 
          fill="url(#whiteGrad)" />
  </g>
</svg>
